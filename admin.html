<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SayuminTech Admin</title>
<style>
body{font-family:sans-serif;padding:15px;background:#111;color:#fff}
.tab{display:flex;gap:10px}
.tab button{flex:1;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:bold}
.active{background:#00c853;color:#fff}
.inactive{background:#333;color:#aaa}
input,select,textarea{width:100%;padding:11px;margin:6px 0;border-radius:8px;border:none;box-sizing:border-box}
.btn{width:100%;padding:13px;background:#00c853;color:#fff;border:none;border-radius:10px;font-size:16px;margin-top:10px;font-weight:bold}
.btn2{background:#ff9800}
.card{background:#222;padding:10px;border-radius:10px;margin-top:10px;display:flex;gap:10px;align-items:center}
.card img{width:60px;height:60px;object-fit:cover;border-radius:8px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<h2>🛠️ SayuminTech Admin - Firebase</h2>

<div class="tab">
<button id="btnP" class="active" onclick="switchMode('products')">🛒 Products</button>
<button id="btnD" class="inactive" onclick="switchMode('downloads')">📥 Downloads</button>
</div>

<p id="modeText">දැන් හදන්නේ: Products</p>

<input id="name" placeholder="Name - උදා: tps51125 / Dell 3520 BIOS">
<input id="price" type="number" placeholder="Price - උදා: 3200">
<select id="category">
<option>Laptop Repair Components</option>
<option>Battery/Charger</option>
<option>Laptop Accessories</option>
<option>Tools</option>
<option>BIOS</option>
<option>Schematic / Boardview</option>
</select>
<input id="img" placeholder="Photo - images/tps.jpg">
<input id="file" placeholder="Download File Link - Downloads වලට විතරයි">
<textarea id="desc" placeholder="Description"></textarea>

<button class="btn" onclick="addItem()">+ ADD කරපන් - Firebase එකට යනවා</button>

<h3>දැම්ම ටික (Firebase එකෙන්):</h3>
<div id="list">Loading...</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyCBG6OXPLdU98fHIS82PXK-BM89Ew4Dc",
  authDomain: "sayumintech.firebaseapp.com",
  databaseURL: "https://sayumintech-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "sayumintech",
  storageBucket: "sayumintech.firebasestorage.app",
  messagingSenderId: "224307692174",
  appId: "1:224307692174:web:9be3ffb2b200f5e5277fdf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let mode = 'products';
let data = { products: [], downloads: [] };

function switchMode(m){
  mode = m;
  document.getElementById('btnP').className = m=='products'?'active':'inactive';
  document.getElementById('btnD').className = m=='downloads'?'active':'inactive';
  document.getElementById('modeText').innerText = 'දැන් හදන්නේ: '+m;
  showList();
}
function addItem(){
  let item = {
    name: document.getElementById('name').value,
    price: Number(document.getElementById('price').value),
    category: document.getElementById('category').value,
    img: document.getElementById('img').value,
    desc: document.getElementById('desc').value
  };
  if(mode=='downloads') item.file = document.getElementById('file').value;
  if(!item.name || !item.price){ alert('Nameයි Price එකයි දාපන් බං!'); return; }
  db.ref(mode).push(item).then(()=>{
    alert('Firebase එකට වැටුනා බං! ✅');
    document.getElementById('name').value=''; document.getElementById('price').value=''; document.getElementById('desc').value=''; document.getElementById('file').value='';
  });
}
function showList(){
  let arr = data[mode] || [];
  document.getElementById('list').innerHTML = arr.map((p)=>`
    <div class="card">
      <img src="${p.img}" onerror="this.src='https://via.placeholder.com/60'">
      <div style="flex:1"><b>${p.name}</b><br>Rs.${p.price} - ${p.category}</div>
      <button onclick="del('${p.key}')" style="background:red;color:#fff;border:none;padding:8px 12px;border-radius:8px">X</button>
    </div>`).join('') || 'තවම මොකුත් නෑ බං';
}
function del(key){ if(confirm('මකනවද?')) db.ref(mode+'/'+key).remove(); }

db.ref('products').on('value', s=>{
  let v = s.val() || {};
  data.products = Object.keys(v).map(k=>({...v[k], key:k}));
  if(mode=='products') showList();
});
db.ref('downloads').on('value', s=>{
  let v = s.val() || {};
  data.downloads = Object.keys(v).map(k=>({...v[k], key:k}));
  if(mode=='downloads') showList();
});
showList();
</script>
</body>
</html>
