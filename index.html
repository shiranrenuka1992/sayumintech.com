<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechParts Lanka - Laptop Parts & Board Repair</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{background:#020617;color:#fff;min-height:100vh}
header{position:sticky;top:0;z-index:50;background:rgba(2,6,23,0.95);backdrop-filter:blur(10px);border-bottom:1px solid #1e40af;padding:12px 14px}
.top{display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:800;font-size:19px} .logo span{color:#38bdf8}
.cart-btn{background:#38bdf8;color:#020617;border:none;padding:8px 14px;border-radius:999px;font-weight:800;cursor:pointer}
.search{margin-top:11px;display:flex;gap:8px}
.search input{flex:1;padding:11px 13px;border-radius:12px;border:1px solid #334155;background:#0f172a;color:#fff;outline:none;font-size:14px}
.search button{padding:11px 14px;border-radius:12px;border:none;background:#38bdf8;font-weight:800;cursor:pointer}
.cats{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#0f172a;border:1px solid #334155;font-size:13px;cursor:pointer}
.cat.active{background:#38bdf8;color:#020617;border-color:#38bdf8;font-weight:800}
.sec-title{padding:6px 14px 2px;font-size:16px;font-weight:800}
.sec-sub{padding:0 14px 4px;color:#94a3b8;font-size:12.5px}
/* 1. PHOTO LOKUWATA */
.product-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.product-card{display:flex;flex-direction:column;background:#0f172a;border-radius:16px;overflow:hidden;border:1px solid #1e40af;cursor:pointer}
.product-img{width:100%;height:165px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:cover}
.product-info{flex:1;padding:10px 11px 0}
.product-name{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px}
.product-desc{color:#94a3b8;font-size:11.5px;line-height:1.5;margin-top:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product-price{font-weight:800;color:#38bdf8;font-size:16px}
.add-btn{background:#38bdf8;border:none;padding:8px 11px;border-radius:10px;font-weight:800;cursor:pointer;font-size:12px;color:#020617}
.download-card{display:flex;gap:12px;background:#0f172a;border:1px solid #1e40af;border-radius:16px;padding:12px;margin:0 14px 12px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:100;display:none;overflow-y:auto}
.modal-content{background:#0f172a;margin:18px;border-radius:18px;padding:16px;max-width:520px;margin-left:auto;margin-right:auto}
.main-img{width:100%;height:260px;object-fit:cover;border-radius:14px;background:#fff}
.thumb{width:64px;height:64px;object-fit:cover;border-radius:10px;cursor:pointer;border:2px solid transparent;background:#fff}
.thumb.active{border-color:#38bdf8}
.close{float:right;background:#1e293b;border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:18px}
.buy-btn{width:100%;padding:13px;border:none;border-radius:12px;background:#25D366;color:#fff;font-weight:800;font-size:15px;cursor:pointer;margin-top:12px}
.add-cart-btn{width:100%;padding:12px;border:1px solid #38bdf8;border-radius:12px;background:transparent;color:#38bdf8;font-weight:800;cursor:pointer;margin-top:8px}
.cart-item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #1e293b}
footer{text-align:center;color:#64748b;font-size:12px;padding:18px}
</style>
</head>
<body>
<header>
<div class="top"><div class="logo">TechParts<span> Lanka</span><div style="font-size:11px;color:#94a3b8;font-weight:400">Laptop Parts • Schematic • BIOS</div></div><button class="cart-btn" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</button></div>
<div class="search"><input id="searchInput" placeholder="Search board number, part name..." oninput="filterAll()"><button onclick="filterAll()">Search</button></div>
</header>
<div class="cats" id="cats"></div>

<div class="sec-title">🔥 Parts For Sale</div><div class="sec-sub">Tested Original Parts • Islandwide Delivery</div>
<div class="product-grid" id="productList"></div>
<div id="pagination" style="display:flex;gap:8px;justify-content:center;align-items:center;padding:10px 16px 20px;flex-wrap:wrap"></div>

<div class="sec-title">📄 Schematic & BoardView</div><div class="sec-sub">Instant Download After Payment</div>
<div id="downloadList"></div>
<footer>TechParts Lanka • Colombo, Sri Lanka<br>WhatsApp: 077 XXX XXXX • COD & Bank Transfer Available</footer>

<!-- PRODUCT MODAL -->
<div class="modal" id="productModal"><div class="modal-content"><button class="close" onclick="closeModal('productModal')">×</button><div id="productDetail"></div></div></div>
<!-- DOWNLOAD MODAL -->
<div class="modal" id="downloadModal"><div class="modal-content"><button class="close" onclick="closeModal('downloadModal')">×</button><div id="downloadDetail"></div></div></div>
<!-- CART MODAL -->
<div class="modal" id="cartModal"><div class="modal-content"><button class="close" onclick="closeModal('cartModal')">×</button><h3>🛒 Your Cart</h3><div id="cartItems" style="margin-top:12px"></div><div id="cartTotal" style="font-weight:800;font-size:18px;margin-top:12px"></div><button class="buy-btn" onclick="checkout()">Order via WhatsApp ✅</button></div></div>

<script>
let products=[]; let downloads=[]; let cart=[];
let currentCategory='All';
var currentPage=1; var itemsPerPage=6; var filteredProducts=[];

fetch('products.json').then(r=>r.json()).then(d=>{products=d; buildCats(); filterAll();});
fetch('downloads.json').then(r=>r.json()).then(d=>{downloads=d; renderDownloads(d);});

function buildCats(){
  let cats=['All',...new Set(products.map(p=>p.category||'General'))];
  document.getElementById('cats').innerHTML=cats.map(c=>'<div class="cat '+(c===currentCategory?'active':'')+'" onclick="setCat(\''+c+'\')">'+c+'</div>').join('');
}
function setCat(c){currentCategory=c; buildCats(); filterAll();}

function filterAll(){
  var s=document.getElementById('searchInput').value.toLowerCase().trim();
  filteredProducts=[];
  for(var i=0;i<products.length;i++){
    var p=products[i];
    var pc=(p.category||"").toLowerCase().trim();
    var cc=currentCategory.toLowerCase().trim();
    var catOk=(cc==="all"||pc===cc);
    var searchOk=(p.name||"").toLowerCase().includes(s)||(p.board||"").toLowerCase().includes(s);
    if(catOk && searchOk) filteredProducts.push(p);
  }
  currentPage=1; renderProductsPage();
  var df=[];
  for(var i=0;i<downloads.length;i++){ if(downloads[i].name.toLowerCase().includes(s)||(downloads[i].board||"").toLowerCase().includes(s)) df.push(downloads[i]); }
  renderDownloads(df);
}

function getImg(p){
  if(p.images && p.images.length>0) return '<img src="'+p.images[0]+'" onerror="this.parentElement.innerHTML=\'📦\'">';
  if(p.img) return '<img src="'+p.img+'" onerror="this.parentElement.innerHTML=\'📦\'">';
  return '<span style="font-size:42px">📦</span>';
}

function renderProducts(list){
  if(list.length===0){document.getElementById('productList').innerHTML='<p style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:20px">No products found 😔</p>';return;}
  let html='';
  list.forEach(p=>{
    let stock=p.stock>0?('✅ In Stock ('+p.stock+')'):'❌ Out of Stock';
    let stockColor=p.stock>0?'#22c55e':'#ef4444';
    let btn=p.stock>0?'<button class="add-btn" onclick="event.stopPropagation();addToCart('+p.id+')">Add 🛒</button>':'<button class="add-btn" disabled style="opacity:0.5">Out</button>';
    let imgC=getImg(p);
    html+='<div class="product-card" onclick="openProduct('+p.id+')"><div class="product-img">'+imgC+'</div><div class="product-info"><div class="product-name">'+p.name+'</div><div class="product-desc">'+(p.desc||'100% Tested Original Quality. Islandwide Courier Available.')+'</div><div style="color:'+stockColor+';font-size:11px;font-weight:600;margin-top:5px">'+stock+'</div></div><div style="display:flex;justify-content:space-between;align-items:center;padding:10px 11px 12px"><div class="product-price">Rs '+p.price+'</div>'+btn+'</div></div>';
  });
  document.getElementById('productList').innerHTML=html;
}

// PAGINATION
function renderProductsPage(){
  var start=(currentPage-1)*itemsPerPage;
  var pageItems=filteredProducts.slice(start,start+itemsPerPage);
  renderProducts(pageItems); renderPagination();
}
function renderPagination(){
  var totalPages=Math.ceil(filteredProducts.length/itemsPerPage);
  var pag=document.getElementById('pagination');
  if(totalPages<=1){pag.innerHTML='';return;}
  var h='';
  var btnStyle='padding:9px 13px;border-radius:10px;cursor:pointer;font-weight:700;background:#1e293b;color:white;border:1px solid #334155;';
  var activeStyle='padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:700;background:#38bdf8;color:#020617;border-color:#38bdf8;';
  if(currentPage>1) h+='<button onclick="goToPage('+(currentPage-1)+')" style="'+btnStyle+'">‹ Prev</button>';
  function addBtn(p){ if(p===currentPage) h+='<button onclick="goToPage('+p+')" style="'+activeStyle+'">'+p+'</button>'; else h+='<button onclick="goToPage('+p+')" style="'+btnStyle+'">'+p+'</button>'; }
  function addDots(){ h+='<span style="color:#94a3b8;font-weight:700;padding:0 4px">...</span>'; }
  if(totalPages<=7){ for(var i=1;i<=totalPages;i++) addBtn(i); }
  else{
    addBtn(1); if(currentPage>4) addDots();
    var start=Math.max(2,currentPage-1); var end=Math.min(totalPages-1,currentPage+1);
    if(currentPage<=4){start=2;end=5;} if(currentPage>=totalPages-3){start=totalPages-4;end=totalPages-1;}
    for(var i=start;i<=end;i++) addBtn(i);
    if(currentPage<totalPages-3) addDots(); addBtn(totalPages);
  }
  if(currentPage<totalPages) h+='<button onclick="goToPage('+(currentPage+1)+')" style="'+btnStyle+'">Next ›</button>';
  pag.innerHTML=h;
}
function goToPage(p){ currentPage=p; renderProductsPage(); window.scrollTo({top:350,behavior:'smooth'}); }

function renderDownloads(list){
  let html='';
  list.forEach(d=>{
    let isFree=d.price===0;
    let priceText=isFree?'FREE':'Rs '+d.price;
    let priceColor=isFree?'#22c55e':'#38bdf8';
    let imgC=(d.img?'<img src="'+d.img+'" style="width:100%;height:100%;object-fit:cover" onerror="this.parentElement.innerHTML=\'📄\'">':'<span style="font-size:42px">📄</span>');
    html+='<div class="download-card" style="flex-direction:column;align-items:stretch;padding:0;overflow:hidden" onclick="openDownload('+d.id+')"><div class="product-img" style="width:100%;height:140px">'+imgC+'</div><div style="padding:10px 11px 12px"><div style="font-weight:700;font-size:13.5px">'+d.name+'</div><div style="color:#94a3b8;font-size:11px;margin-top:4px">Board: '+(d.board||'')+' • '+(d.type||d.category)+'</div><div style="color:#94a3b8;font-size:11.5px;margin-top:5px;line-height:1.5">'+(d.desc||'').substring(0,70)+'...</div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:9px"><div style="color:'+priceColor+';font-weight:800">'+priceText+'</div><button class="add-btn">View →</button></div></div></div>';
  });
  document.getElementById('downloadList').innerHTML=html||'<p style="text-align:center;color:#94a3b8;padding:10px">No files found</p>';
}

function openProduct(id){
  let p=products.find(x=>x.id===id); if(!p) return;
  let imgs=p.images && p.images.length>0 ? p.images : (p.img?[p.img]:[]);
  let main=imgs.length>0?'<img id="mainImg" class="main-img" src="'+imgs[0]+'">':'<div style="height:180px;display:flex;align-items:center;justify-content:center;font-size:60px;background:#fff;border-radius:14px">📦</div>';
  let thumbs=imgs.slice(0,3).map((im,i)=>'<img src="'+im+'" class="thumb '+(i===0?'active':'')+'" onclick="document.getElementById(\'mainImg\').src=\''+im+'\';document.querySelectorAll(\'.thumb\').forEach(t=>t.classList.remove(\'active\'));this.classList.add(\'active\')">').join('');
  document.getElementById('productDetail').innerHTML=main+'<div style="display:flex;gap:8px;margin-top:10px">'+thumbs+'</div><h3 style="margin-top:14px">'+p.name+'</h3><p style="color:#94a3b8;font-size:13px;margin-top:6px;line-height:1.6">'+(p.desc||'')+'</p><div style="font-size:22px;font-weight:800;color:#38bdf8;margin-top:10px">Rs '+p.price+'</div><div style="font-size:12px;margin-top:4px;color:'+(p.stock>0?'#22c55e':'#ef4444')+'">'+(p.stock>0?'✅ In Stock':'❌ Out of Stock')+'</div><button class="buy-btn" onclick="buyNow('+p.id+')">Buy via WhatsApp ✅</button><button class="add-cart-btn" onclick="addToCart('+p.id+');closeModal(\'productModal\')">Add to Cart 🛒</button>';
  document.getElementById('productModal').style.display='block';
}
function openDownload(id){
  let d=downloads.find(x=>x.id===id); if(!d) return;
  let isFree=d.price===0;
  document.getElementById('downloadDetail').innerHTML='<div style="font-size:50px;text-align:center">📄</div><h3 style="margin-top:10px">'+d.name+'</h3><p style="color:#94a3b8;font-size:13px;margin-top:6px">Board: '+(d.board||'')+' • Type: '+(d.type||'')+'</p><p style="color:#94a3b8;font-size:13px;margin-top:6px;line-height:1.6">'+(d.desc||'')+'</p><div style="font-size:20px;font-weight:800;color:#22c55e;margin-top:10px">'+(isFree?'FREE':'Rs '+d.price)+'</div><button class="buy-btn" onclick="buyDownload('+d.id+')">'+(isFree?'Download FREE 📥':'Buy via WhatsApp ✅')+'</button>';
  document.getElementById('downloadModal').style.display='block';
}
function closeModal(id){document.getElementById(id).style.display='none';}
function addToCart(id){ let p=products.find(x=>x.id===id); let ex=cart.find(x=>x.id===id); if(ex) ex.qty++; else cart.push({...p,qty:1}); updateCart(); }
function updateCart(){ document.getElementById('cartCount').innerText=cart.reduce((a,c)=>a+c.qty,0); let h=''; let total=0; cart.forEach((it,i)=>{total+=it.price*it.qty; h+='<div class="cart-item"><div><b>'+it.name+'</b><br><span style="color:#94a3b8;font-size:12px">Rs '+it.price+' x '+it.qty+'</span></div><div><b>Rs '+(it.price*it.qty)+'</b><br><button onclick="removeCart('+i+')" style="background:#ef4444;border:none;color:#fff;padding:4px 8px;border-radius:6px;cursor:pointer;margin-top:4px">Remove</button></div></div>';}); document.getElementById('cartItems').innerHTML=h||'Cart is empty'; document.getElementById('cartTotal').innerText='Total: Rs '+total; }
function removeCart(i){cart.splice(i,1); updateCart();}
function openCart(){updateCart(); document.getElementById('cartModal').style.display='block';}
function buyNow(id){ let p=products.find(x=>x.id===id); window.open('https://wa.me/9477XXXXXXX?text='+encodeURIComponent('Hi! I want to buy: '+p.name+' - Rs '+p.price),'_blank'); }
function buyDownload(id){ let d=downloads.find(x=>x.id===id); if(d.price===0){ window.open(d.file,'_blank'); } else { window.open('https://wa.me/9477XXXXXXX?text='+encodeURIComponent('Hi! I want to buy: '+d.name+' - Rs '+d.price),'_blank'); } }
function checkout(){ if(cart.length===0) return alert('Cart is empty'); let msg='Hi! I want to order:\n'; cart.forEach(it=>msg+='- '+it.name+' x '+it.qty+' = Rs '+(it.price*it.qty)+'\n'); window.open('https://wa.me/9477XXXXXXX?text='+encodeURIComponent(msg),'_blank'); }
</script>
</body>
</html>
