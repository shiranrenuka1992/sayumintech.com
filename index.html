<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYUMIN TECH</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white}
.header{background:#1e293b;padding:15px;position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:bold;font-size:20px;color:#38bdf8}
.search-box{padding:8px 12px;border-radius:20px;border:none;width:200px}
.categories{display:flex;gap:10px;padding:15px;overflow-x:auto}
.cat-btn{padding:8px 15px;border-radius:20px;border:1px solid #334155;background:#1e293b;color:white;white-space:nowrap;cursor:pointer}
.cat-btn.active{background:#38bdf8;color:black}
.product-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px;padding:15px}
.product-card{background:#1e293b;border-radius:12px;overflow:hidden;border:1px solid #334155}
.product-img{height:160px;background:white;display:flex;align-items:center;justify-content:center;font-size:50px;overflow:hidden}
.product-img img{width:100%;height:100%;object-fit:contain}
.product-info{padding:10px}
.product-name{font-size:13px;height:32px;overflow:hidden}
.in-stock{color:#4ade80;font-size:12px;margin:5px 0}
.out-stock{color:#f87171;font-size:12px;margin:5px 0}
.product-price{font-weight:bold;color:#38bdf8;margin:5px 0}
.add-to-cart-btn{width:100%;padding:8px;background:#38bdf8;border:none;border-radius:6px;font-weight:bold;cursor:pointer}
.request-stock-btn{width:100%;padding:8px;background:#334155;color:white;border:none;border-radius:6px;cursor:pointer}
.cart-icon{cursor:pointer;background:#38bdf8;color:black;padding:8px 15px;border-radius:20px;font-weight:bold}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:200;justify-content:center;align-items:center}
.modal-content{background:#1e293b;width:90%;max-width:400px;border-radius:12px;padding:20px;max-height:80vh;overflow-y:auto}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #334155}
.qty-btn{background:#334155;border:none;color:white;width:25px;height:25px;border-radius:50%;cursor:pointer}
.remove-btn{background:#ef4444;border:none;color:white;padding:4px 8px;border-radius:4px;cursor:pointer}
.checkout-btn{width:100%;padding:12px;background:#22c55e;border:none;border-radius:8px;font-weight:bold;margin-top:15px;cursor:pointer;color:white}
.no-products{text-align:center;padding:50px;color:#94a3b8}
</style>
</head>
<body>
<div class="header">
<div class="logo">SAYUMIN TECH</div>
<input type="text" id="searchInput" class="search-box" placeholder="Search..." oninput="filterProducts()">
<div class="cart-icon" onclick="openCart()">Cart (<span id="cartCount">0</span>)</div>
</div>
<div class="categories" id="categoryList"></div>
<div class="product-grid" id="productList"></div>

<div class="modal" id="cartModal">
<div class="modal-content">
<h3>Your Cart</h3>
<div id="cartItems"></div>
<div id="cartTotal" style="margin-top:15px;font-weight:bold;"></div>
<button class="checkout-btn" onclick="checkoutWhatsApp()">Checkout via WhatsApp</button>
<button onclick="closeCart()" style="width:100%;margin-top:10px;padding:8px;background:transparent;border:1px solid #475569;color:white;border-radius:8px;">Close</button>
</div>
</div>

<script>
var CONFIG={whatsapp:"94721352940"};
var categories=["All","BIOS Files","Schematics","BoardView","Laptop Repair Components","Laptop Repair Accessories","Battery","Tools","Multimeter"];
var products=[];
var cart=[];var currentCategory="All";

function loadCategories(){var html="";for(var i=0;i<categories.length;i++){var cat=categories[i];var activeClass=cat===currentCategory?"active":"";html+='<button class="cat-btn '+activeClass+'" onclick="selectCategory(\''+cat+'\')">'+cat+'</button>';}document.getElementById('categoryList').innerHTML=html;}
function selectCategory(c){currentCategory=c;loadCategories();filterProducts();}
function filterProducts(){var searchText=document.getElementById('searchInput').value.toLowerCase();var filtered=[];for(var i=0;i<products.length;i++){var p=products[i];var matchCat=currentCategory==="All"||p.category===currentCategory;var matchSearch=p.name.toLowerCase().includes(searchText);if(matchCat&&matchSearch)filtered.push(p);}renderProducts(filtered);}

function renderProducts(arr){
  var list=document.getElementById('productList');
  if(arr.length===0){list.innerHTML='<div class="no-products">No products found</div>';return;}
  var html="";
  for(var i=0;i<arr.length;i++){
    var p=arr[i];
    var stockText=p.stock?'<div class="in-stock">✓ In Stock</div>':'<div class="out-stock">✕ Out of Stock</div>';
    var btnText=p.stock?'<button class="add-to-cart-btn" onclick="addToCart('+p.id+')">Add to Cart</button>':'<button class="request-stock-btn" onclick="requestStock('+p.id+')">Request Stock</button>';
    // PHOTO FIX - මේකයි අලුත් හරිය
    var isPhoto = p.img.includes('images/') || p.img.includes('.jpg') || p.img.includes('.png') || p.img.includes('http');
    var imgContent = isPhoto? '<img src="'+p.img+'" alt="'+p.name+'">' : p.img;
    html+='<div class="product-card"><div class="product-img">'+imgContent+'</div><div class="product-info"><div class="product-name">'+p.name+'</div>'+stockText+'<div class="product-price">Rs '+p.price+'</div>'+btnText+'</div></div>';
  }
  list.innerHTML=html;
}

function addToCart(pid){var product=null;for(var i=0;i<products.length;i++){if(products[i].id===pid){product=products[i];break;}}if(!product||!product.stock)return;var found=false;for(var i=0;i<cart.length;i++){if(cart[i].id===pid){cart[i].qty++;found=true;break;}}if(!found)cart.push({id:pid,name:product.name,price:product.price,qty:1});updateCartCount();}
function requestStock(pid){var p=null;for(var i=0;i<products.length;i++){if(products[i].id===pid){p=products[i];break;}}if(!p)return;var msg='SAYUMIN TECH - Request Stock%0A%0AProduct: '+p.name+'%0APrice: Rs '+p.price;window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+msg,'_blank');}
function updateCartCount(){var total=0;for(var i=0;i<cart.length;i++){total+=cart[i].qty;}document.getElementById('cartCount').textContent=total;}
function openCart(){var cartModal=document.getElementById('cartModal');var cartItems=document.getElementById('cartItems');var cartTotal=document.getElementById('cartTotal');if(cart.length===0){cartItems.innerHTML='Cart හිස්!';cartTotal.innerHTML='';}else{var html='';var total=0;for(var i=0;i<cart.length;i++){var item=cart[i];var itemTotal=item.price*item.qty;total+=itemTotal;html+='<div class="cart-item"><div><div>'+item.name+'</div><div><button class="qty-btn" onclick="changeQty('+i+',-1)">-</button><span style="margin:0 8px;">'+item.qty+'</span><button class="qty-btn" onclick="changeQty('+i+',1)">+</button></div></div><div>Rs '+itemTotal+' <button class="remove-btn" onclick="removeFromCart('+i+')">X</button></div></div>';}cartItems.innerHTML=html;cartTotal.innerHTML='Total: Rs '+total;}cartModal.style.display='flex';}
function changeQty(idx,ch){cart[idx].qty+=ch;if(cart[idx].qty<=0){cart.splice(idx,1);}updateCartCount();openCart();}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function removeFromCart(idx){cart.splice(idx,1);updateCartCount();openCart();}
function checkoutWhatsApp(){if(cart.length===0){alert('Cart හිස්!');return;}var msg='SAYUMIN TECH - New Order%0A%0A';var total=0;for(var i=0;i<cart.length;i++){var item=cart[i];var itemTotal=item.price*item.qty;total+=itemTotal;msg+=item.name+' x'+item.qty+' = Rs '+itemTotal+'%0A';}msg+='%0ATotal: Rs '+total;window.open('https://wa.me/'+CONFIG.whatsapp+'?text='+msg,'_blank');}
window.onclick=function(e){if(e.target==document.getElementById('cartModal')){closeCart();}}

fetch('products.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  if(Array.isArray(data)){products=data;console.log('Loaded',data.length);loadCategories();filterProducts();}
}).catch(e=>{console.error(e);document.getElementById('productList').innerHTML='<div class="no-products">products.json load error: '+e+'<br>Check file name is correct</div>';});
</script>
</body>
</html>
