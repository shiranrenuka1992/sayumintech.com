<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAYUMIN TECH - Laptop Repair Parts & Schematic</title>
<meta name="description" content="Search by Board Number - Schematic, BoardView, BIOS, Parts - SAYUMIN TECH">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{background:#0f172a;color:white}
header{background:#020617;padding:15px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:22px;color:#38bdf8} .logo span{color:#fbbf24}
.hero{text-align:center;padding:40px 15px;background:linear-gradient(135deg,#1e293b,#0f172a)}
.hero h1{font-size:28px;line-height:1.3} .hero h1 span{color:#38bdf8}
.hero p{color:#94a3b8;margin-top:10px}
.search-box{max-width:600px;margin:20px auto;display:flex;background:white;border-radius:50px;overflow:hidden;padding:5px}
.search-box input{flex:1;border:none;outline:none;padding:12px 15px;font-size:16px;color:#000}
.search-box button{background:#0ea5e9;color:white;border:none;padding:10px 22px;border-radius:50px;font-weight:700;cursor:pointer}
.cats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:15px}
.cats button{background:#1e293b;color:white;border:1px solid #334155;padding:8px 16px;border-radius:50px;cursor:pointer}
.cats button.active{background:#0ea5e9;border-color:#0ea5e9}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:15px;padding:20px;max-width:1100px;margin:auto}
.card{background:#1e293b;border:1px solid #334155;border-radius:15px;padding:16px}
.card h3{font-size:15px;line-height:1.4;min-height:42px}
.card .meta{color:#94a3b8;font-size:12px;line-height:1.6;margin:8px 0}
.card .price{font-weight:800;font-size:18px;margin:8px 0} .free{color:#4ade80} .paid{color:#fbbf24}
.btn{display:block;text-align:center;text-decoration:none;width:100%;padding:11px;border:none;border-radius:10px;color:white;font-weight:700;cursor:pointer;margin-top:8px;font-size:14px}
.btn-free{background:linear-gradient(90deg,#38bdf8,#6366f1)}
.btn-paid{background:#25D366}
footer{text-align:center;padding:30px;color:#64748b;font-size:13px;line-height:1.8}
.whatsapp{position:fixed;bottom:20px;right:20px;background:#25D366;color:white;padding:14px 20px;border-radius:50px;text-decoration:none;font-weight:700;box-shadow:0 5px 20px rgba(0,0,0,.4);z-index:200}
</style>
</head>
<body>

<header><div class="logo">SAYUMIN <span>TECH ⚡</span></div><div style="font-size:13px;color:#94a3b8">Colombo | Islandwide Delivery</div></header>

<div class="hero">
<h1>Search by <span>Board Number</span><br>Schematic • BIOS • Parts</h1>
<p>Example: DA0X8QMB8E0 , LA-K491P , NM-C421</p>
<div class="search-box"><input id="searchInput" placeholder="Board Number එක ගහන්න... DA0X8QMB8E0" oninput="doSearch()"><button onclick="doSearch()">Search 🔍</button></div>
<div class="cats" id="catBtns">
<button class="active" onclick="filterCat('All',this)">All</button>
<button onclick="filterCat('Schematic',this)">Schematic</button>
<button onclick="filterCat('BIOS',this)">BIOS</button>
<button onclick="filterCat('Parts',this)">Parts</button>
<button onclick="filterCat('BoardView',this)">BoardView</button>
</div>
</div>

<div class="grid" id="downloadList"><div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:30px">Loading... ⚡</div></div>

<footer>SAYUMIN TECH © 2026<br>Watermark: SAYUMIN TECH ⚡ - All Files Protected<br>WhatsApp: 077XXXXXXX</footer>
<a class="whatsapp" href="https://wa.me/9477XXXXXXX?text=Hi%20Sayumin%20Tech" target="_blank">💬 WhatsApp Us</a>

<script>
var allProducts=[];
var currentCat='All';
var waNumber="9477XXXXXXX";

// products.json එකෙන් ඔක්කොම ගන්නවා
fetch('products.json?v='+Date.now()).then(r=>r.json()).then(data=>{
  allProducts=data;
  renderDownloads(allProducts);
}).catch(e=>{
  document.getElementById('downloadList').innerHTML='<div style="grid-column:1/-1;text-align:center">products.json File එක නෑ! GitHub එකට දාන්න!</div>';
});

function renderDownloads(arr){
  var list=document.getElementById('downloadList');
  if(arr.length===0){list.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#94a3b8;padding:30px">No file found - WhatsApp us!</div>';return;}
  var html="";
  for(var i=0;i<arr.length;i++){
    var d=arr[i];
    var isFree=d.price===0;
    var priceText=isFree?'FREE':'Rs '+d.price;
    var priceClass=isFree?'free':'paid';
    var btn="";
    if(isFree){
      // FREE නම් කෙලින්ම PC එකට Download
      btn='<a class="btn btn-free" href="'+d.file+'" download>⬇️ Download to PC 💻</a>';
    }else{
      // PAID නම් WhatsApp
      var msg=encodeURIComponent("Hi Sayumin Tech! I want to buy: "+d.name+" - Rs "+d.price);
      btn='<a class="btn btn-paid" href="https://wa.me/'+waNumber+'?text='+msg+'" target="_blank">Buy via WhatsApp - Rs '+d.price+' 💬</a>';
    }
    html+='<div class="card"><div style="font-size:28px">📄</div><h3>'+d.name+'</h3><div class="meta">Board: '+d.board+'<br>Category: '+d.category+'<br>Watermark: SAYUMIN TECH ⚡</div><div class="price '+priceClass+'">'+priceText+'</div>'+btn+'</div>';
  }
  list.innerHTML=html;
}

function doSearch(){
  var q=document.getElementById('searchInput').value.toLowerCase().trim();
  var filtered=allProducts.filter(function(d){
    var matchCat=(currentCat==='All'||d.category===currentCat);
    var matchQ=!q||d.board.toLowerCase().includes(q)||d.name.toLowerCase().includes(q);
    return matchCat&&matchQ;
  });
  renderDownloads(filtered);
}
function filterCat(cat,btn){
  currentCat=cat;
  var btns=document.querySelectorAll('.cats button');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  btn.classList.add('active');
  doSearch();
}
</script>
</body>
</html>
