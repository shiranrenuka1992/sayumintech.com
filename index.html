<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MY SHOP - SL</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<style>body{font-family:sans-serif;background:#f5f5f5} .no-scrollbar::-webkit-scrollbar{display:none}</style>
</head>
<body>
<header class="bg-black text-white p-4 sticky top-0 z-50 flex justify-between items-center">
<div class="font-black text-xl tracking-widest">MY SHOP <span class="text-yellow-400">SL</span></div>
<div class="text-xs bg-yellow-400 text-black px-2 py-1 rounded-full font-bold">CASH ON DELIVERY</div>
</header>
<div class="p-3 flex gap-2 overflow-x-auto no-scrollbar" id="cats">
<button onclick="filterCat('all')" class="cat-btn bg-black text-white px-4 py-2 rounded-full text-sm whitespace-nowrap">All</button>
</div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-4 gap-3 p-3"></div>
<div id="empty" class="hidden text-center py-20 text-gray-500">තවම බඩු නෑ බං... Admin එකෙන් දාපන්!</div>

<script>
const firebaseConfig = {
  apiKey: "MEKA VENAS KARAPAN",
  authDomain: "MEKA VENAS KARAPAN",
  databaseURL: "https://myshopsl-efcd2-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "myshopsl-efcd2",
  storageBucket: "MEKA VENAS KARAPAN",
  messagingSenderId: "MEKA VENAS KARAPAN",
  appId: "MEKA VENAS KARAPAN"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
let allProducts = [];
let curCat = 'all';

db.ref('products').on('value', snap => {
  const data = snap.val() || {};
  allProducts = Object.keys(data).map(k => ({id:k, ...data[k]}));
  renderCats();
  render();
});

function renderCats(){
  const cats = ['all', ...new Set(allProducts.map(p=>p.category))];
  document.getElementById('cats').innerHTML = cats.map(c=>
    `<button onclick="filterCat('${c}')" class="cat-btn ${c===curCat?'bg-black text-white':'bg-white'} px-4 py-2 rounded-full text-sm whitespace-nowrap shadow">${c==='all'?'All':c}</button>`
  ).join('');
}
function filterCat(c){ curCat=c; renderCats(); render(); }
function render(){
  const list = allProducts.filter(p=> curCat==='all' || p.category===curCat);
  document.getElementById('empty').classList.toggle('hidden', list.length>0);
  document.getElementById('grid').innerHTML = list.map(p=>`
  <div class="bg-white rounded-2xl overflow-hidden shadow">
    <img src="${p.image}" class="w-full h-44 object-cover" onerror="this.src='https://via.placeholder.com/300'">
    <div class="p-3">
      <div class="text-[11px] text-gray-400">${p.category||''}</div>
      <div class="font-bold text-sm leading-tight">${p.name}</div>
      <div class="flex justify-between items-center mt-2">
        <div class="font-black text-red-600">Rs.${p.price}</div>
        <a target="_blank" href="https://wa.me/947XXXXXXXX?text=${encodeURIComponent('Hi! '+p.name+' එක ගන්න ඕනේ')}" class="bg-green-500 text-white text-xs px-3 py-2 rounded-full font-bold">Order 🛒</a>
      </div>
    </div>
  </div>`).join('');
}
</script>
</body>
</html>
