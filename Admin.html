<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sayumin Admin</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;display:flex;justify-content:center;padding:20px}
.box{background:#222;padding:25px;border-radius:15px;width:100%;max-width:400px;border:1px solid #333}
input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none;box-sizing:border-box}
button{width:100%;padding:12px;background:orange;color:#000;font-weight:bold;border:none;border-radius:8px;cursor:pointer;margin-top:10px}
#loginBox{display:block} #adminBox{display:none}
</style>
</head>
<body>
<div class="box">
  <div id="loginBox">
    <h2>🔐 Sayumin Admin Login</h2>
    <input type="password" id="pass" placeholder="Password එක දාන්න">
    <button onclick="login()">Login</button>
  </div>
  <div id="adminBox">
    <h2>➕ Product එකක් දාන්න</h2>
    <input id="pName" placeholder="Product Name - ex: Dell Battery">
    <input id="pPrice" placeholder="Price - ex: 1200">
    <input id="pImage" placeholder="Image Link (imgur link එකක්)">
    <input id="pCategory" placeholder="Category - ex: Battery">
    <button onclick="addProduct()">Add Product</button>
    <p id="msg" style="color:lightgreen"></p>
    <hr style="margin:20px 0;border-color:#333">
    <p style="font-size:12px;color:#aaa">Product දැම්මම ඒක localStorage එකේ save වෙනවා. ඊට පස්සේ Main Site එකේ Auto පේනවා.</p>
  </div>
</div>
<script>
function login(){
  if(document.getElementById('pass').value === 'sayumin123'){
    document.getElementById('loginBox').style.display='none';
    document.getElementById('adminBox').style.display='block';
  } else { alert('Password වැරදියි!'); }
}
function addProduct(){
  const name = document.getElementById('pName').value;
  const price = document.getElementById('pPrice').value;
  const image = document.getElementById('pImage').value;
  const category = document.getElementById('pCategory').value;
  if(!name || !price) return alert('Name & Price දාන්න');
  
  let products = JSON.parse(localStorage.getItem('sayumin_products') || '[]');
  products.push({name, price, image, category, id: Date.now()});
  localStorage.setItem('sayumin_products', JSON.stringify(products));
  document.getElementById('msg').innerText = '✅ ' + name + ' Added!';
  document.getElementById('pName').value=''; document.getElementById('pPrice').value='';
}
</script>
</body>
</html>
